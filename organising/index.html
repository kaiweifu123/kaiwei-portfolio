<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaiwei Fu - AI Experience Designer</title>
    <meta name="description" content="Portfolio of Kaiwei Fu, AI Experience Designer. Product design case studies and illustration." />
    <style>
      :root {
        --page-loader-surface: var(--surface-base, #ffffff);
        --page-loader-ink: var(--text-hero-display, #0a0a0a);
        --page-loader-track: rgba(10, 10, 10, 0.12);
        --page-loader-threshold: 600ms;
        --page-loader-min-visible: 650ms;
        --page-loader-progress-duration: 4000ms;
        --page-loader-exit-hold: 150ms;
        --page-loader-exit-duration: 700ms;
        --page-loader-ease: cubic-bezier(0.16, 1, 0.3, 1);
        --page-loader-edge: clamp(18px, 2.4vw, 40px);
        --page-loader-line-top: 55vh;
        --page-loader-curve-depth: clamp(96px, 14vw, 260px);
      }

      #page-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        color: var(--page-loader-ink);
        opacity: 0;
        pointer-events: none;
        overflow: visible;
        contain: layout paint style;
        transition: opacity 160ms var(--page-loader-ease);
      }

      #page-loader::before {
        content: "";
        position: absolute;
        inset: 0 0 calc(var(--page-loader-curve-depth) * -1);
        background: var(--page-loader-surface);
        border-bottom-right-radius: 50% var(--page-loader-curve-depth);
        border-bottom-left-radius: 50% var(--page-loader-curve-depth);
        transform: translate3d(0, 0, 0);
        transition: transform var(--page-loader-exit-duration) var(--page-loader-ease);
        backface-visibility: hidden;
        will-change: transform;
      }

      #page-loader[data-visible="true"] {
        opacity: 1;
      }

      #page-loader[data-done="true"] {
        opacity: 1;
      }

      #page-loader[data-done="true"]::before {
        transform: translate3d(0, calc(-100% - var(--page-loader-curve-depth)), 0);
      }

      .page-loader__inner {
        position: absolute;
        inset: 0;
        z-index: 1;
        opacity: 1;
        transition: opacity 120ms ease-out;
        will-change: opacity;
      }

      .page-loader__statement {
        position: absolute;
        top: 76px;
        left: 22px;
        display: flex;
        align-items: center;
        gap: 0.28em;
        font-family: "Graphik", "Graphik Web", "Helvetica Neue", Arial, sans-serif;
        font-size: 56px;
        font-weight: 700;
        line-height: 1.08;
        letter-spacing: -0.045em;
        white-space: nowrap;
      }

      .page-loader__word-window {
        position: relative;
        width: 0;
        height: 1.08em;
        overflow: hidden;
        perspective: 480px;
        transition: width 460ms var(--page-loader-ease);
      }

      .page-loader__word,
      .page-loader__word-sizer {
        white-space: nowrap;
      }

      .page-loader__word {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        color: var(--loader-word-color);
        backface-visibility: hidden;
        transform-origin: center center;
        will-change: transform, opacity;
      }

      .page-loader__word-sizer {
        position: fixed;
        top: -100vh;
        left: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #page-loader[data-done="true"] .page-loader__inner {
        opacity: 0;
      }

      .page-loader__meter {
        position: absolute;
        top: var(--page-loader-line-top);
        right: var(--page-loader-edge);
        left: var(--page-loader-edge);
        height: 4px;
        overflow: hidden;
        background: var(--page-loader-track);
      }

      .page-loader__bar {
        width: 100%;
        height: 100%;
        background: currentColor;
        transform: scaleX(var(--page-loader-progress, 0));
        transform-origin: left center;
        transition: transform 120ms linear;
      }

      .page-loader__count {
        position: absolute;
        right: var(--page-loader-edge);
        bottom: clamp(18px, 3.8vw, 64px);
        font-family: var(--font-hero-display-family, "Inter", "Helvetica Neue", Arial, sans-serif);
        font-size: clamp(76px, 18vw, 260px);
        font-weight: var(--font-weight-hero-title, 650);
        line-height: 0.76;
        letter-spacing: 0;
        text-align: right;
      }

      @media (prefers-reduced-motion: reduce) {
        #page-loader {
          transition: opacity 120ms ease-out;
        }

        #page-loader[data-done="true"] {
          opacity: 0;
          transform: none;
        }

        #page-loader::before {
          transition: none;
        }

        .page-loader__bar {
          transition: none;
          transform: scaleX(1);
        }

        .page-loader__word-window {
          transition: none;
        }
      }

      @media (max-width: 720px) {
        .page-loader__statement {
          top: 48px;
          right: 22px;
          font-size: clamp(28px, 7.5vw, 42px);
        }
      }

    </style>
    <script>
      (() => {
        const readMs = (name, fallback) => {
          const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
          const value = Number.parseFloat(raw);
          if (!Number.isFinite(value)) return fallback;
          return raw.endsWith('ms') ? value : value * 1000;
        };
        const loaderPreview = new URLSearchParams(window.location.search).has('loader-preview');
        const threshold = loaderPreview ? 0 : readMs('--page-loader-threshold', 300);
        const minVisible = readMs('--page-loader-min-visible', 650);
        const duration = readMs('--page-loader-progress-duration', 4000);
        const exitHold = readMs('--page-loader-exit-hold', 150);
        const exitDuration = readMs('--page-loader-exit-duration', 700);
        const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
        let shown = false;
        let done = false;
        let raf = 0;
        let startedAt = 0;
        let shownAt = 0;
        let loader;
        let count;
        let wordTimer = 0;
        let wordAnimation;

        const loaderWords = [
          { label: 'seek', color: '#1473e6' },
          { label: 'break', color: '#ef4b32' },
          { label: 'ask', color: '#16a36a' },
          { label: 'build', color: '#d47b00' },
          { label: 'dream', color: '#d83bd2' },
          { label: 'wander', color: '#008ca8' },
          { label: 'create', color: '#7147d9' },
          { label: 'play', color: '#8b9400' },
          { label: 'push', color: '#ed1853' }
        ];

        const startWordLoop = () => {
          const word = loader?.querySelector('.page-loader__word');
          const sizer = loader?.querySelector('.page-loader__word-sizer');
          const wordWindow = loader?.querySelector('.page-loader__word-window');
          if (!word || !sizer || !wordWindow) return;
          let wordIndex = 4;

          const setWord = (index) => {
            const item = loaderWords[index];
            word.textContent = item.label;
            word.style.setProperty('--loader-word-color', item.color);
            sizer.textContent = item.label;
            wordWindow.style.width = `${Math.ceil(sizer.getBoundingClientRect().width)}px`;
          };

          const scheduleWord = () => {
            clearTimeout(wordTimer);
            if (done || reduceMotion) return;
            wordTimer = window.setTimeout(flipWord, 820);
          };

          const flipWord = async () => {
            const nextIndex = (wordIndex + 1) % loaderWords.length;
            const exitAnimation = word.animate([
              { transform: 'translateY(0) rotateX(0deg)', opacity: 1 },
              { transform: 'translateY(-62%) rotateX(76deg)', opacity: 0 }
            ], { duration: 270, easing: 'cubic-bezier(0.4, 0, 1, 1)', fill: 'forwards' });
            wordAnimation = exitAnimation;
            await exitAnimation.finished.catch(() => {});
            if (done) return;

            wordIndex = nextIndex;
            setWord(wordIndex);
            const enterAnimation = word.animate([
              { transform: 'translateY(62%) rotateX(-76deg)', opacity: 0 },
              { transform: 'translateY(0) rotateX(0deg)', opacity: 1 }
            ], { duration: 350, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'forwards' });
            wordAnimation = enterAnimation;
            exitAnimation.cancel();
            await enterAnimation.finished.catch(() => {});
            if (enterAnimation.playState === 'finished') {
              enterAnimation.commitStyles();
              enterAnimation.cancel();
            }
            scheduleWord();
          };

          setWord(wordIndex);
          document.fonts?.ready.then(() => setWord(wordIndex));
          scheduleWord();
        };

        const setProgress = (value) => {
          if (!loader || !count) return;
          const clamped = Math.max(0, Math.min(100, value));
          loader.style.setProperty('--page-loader-progress', String(clamped / 100));
          count.textContent = `${Math.round(clamped)}%`;
        };

        const finish = () => {
          if (loaderPreview) return;
          if (done) return;
          done = true;
          cancelAnimationFrame(raf);
          clearTimeout(wordTimer);
          wordAnimation?.cancel();
          window.__finishPageLoader = finish;
          if (!shown || !loader) return;
          const visibleFor = performance.now() - shownAt;
          const finishDelay = reduceMotion ? 0 : Math.max(0, minVisible - visibleFor);
          setTimeout(() => {
            setProgress(100);
            setTimeout(() => {
              loader.dataset.done = 'true';
              loader.style.pointerEvents = 'none';
              setTimeout(() => loader?.remove(), reduceMotion ? 120 : exitDuration);
            }, exitHold);
          }, finishDelay);
        };

        const tick = (time) => {
          if (done || !shown) return;
          if (!startedAt) startedAt = time;
          const elapsed = Math.min(1, (time - startedAt) / duration);
          const eased = 1 - Math.pow(1 - elapsed, 4);
          setProgress(eased * 90);
          if (elapsed < 1) raf = requestAnimationFrame(tick);
        };

        const show = () => {
          if (done || shown) return;
          shown = true;
          shownAt = performance.now();
          document.body.insertAdjacentHTML(
            'afterbegin',
            '<div id="page-loader" aria-hidden="true"><div class="page-loader__inner"><div class="page-loader__statement"><span>To</span><span class="page-loader__word-window"><span class="page-loader__word-sizer"></span><span class="page-loader__word"></span></span><span>is to resist stasis.</span></div><div class="page-loader__meter"><div class="page-loader__bar"></div></div><div class="page-loader__count">0%</div></div></div>'
          );
          loader = document.getElementById('page-loader');
          count = loader?.querySelector('.page-loader__count');
          startWordLoop();
          setProgress(reduceMotion ? 100 : 0);
          requestAnimationFrame(() => {
            if (!loader || done) return;
            loader.dataset.visible = 'true';
            if (!reduceMotion) raf = requestAnimationFrame(tick);
          });
        };

        window.__finishPageLoader = finish;
        window.addEventListener('load', finish, { once: true });
        setTimeout(show, threshold);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
