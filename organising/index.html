<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaiwei Fu - AI Experience Designer</title>
    <meta name="description" content="Portfolio of Kaiwei Fu, AI Experience Designer. Product design case studies and illustration." />
    <style>
      :root {
        --page-loader-surface: var(--surface-base, #ffffff);
        --page-loader-ink: var(--text-hero-display, #0a0a0a);
        --page-loader-track: rgba(10, 10, 10, 0.12);
        --page-loader-threshold: 300ms;
        --page-loader-progress-duration: 4000ms;
        --page-loader-exit-hold: 150ms;
        --page-loader-fade-duration: 400ms;
        --page-loader-ease: cubic-bezier(0.16, 1, 0.3, 1);
      }

      #page-loader {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: grid;
        place-items: center;
        padding: clamp(24px, 5vw, 72px);
        background: var(--page-loader-surface);
        color: var(--page-loader-ink);
        opacity: 0;
        pointer-events: none;
        transition: opacity var(--page-loader-fade-duration) var(--page-loader-ease);
      }

      #page-loader[data-visible="true"] {
        opacity: 1;
      }

      #page-loader[data-done="true"] {
        opacity: 0;
      }

      .page-loader__inner {
        display: grid;
        width: min(760px, 100%);
        gap: clamp(18px, 3vw, 36px);
      }

      .page-loader__meter {
        height: 2px;
        overflow: hidden;
        background: var(--page-loader-track);
      }

      .page-loader__bar {
        width: 100%;
        height: 100%;
        background: currentColor;
        transform: scaleX(var(--page-loader-progress, 0));
        transform-origin: left center;
        transition: transform 120ms linear;
      }

      .page-loader__count {
        font-family: var(--font-hero-display-family, "Inter", "Helvetica Neue", Arial, sans-serif);
        font-size: clamp(52px, 13vw, 168px);
        font-weight: var(--font-weight-hero-title, 650);
        line-height: 0.9;
        letter-spacing: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        #page-loader {
          transition-duration: 120ms;
        }

        .page-loader__bar {
          transition: none;
          transform: scaleX(1);
        }
      }
    </style>
    <script>
      (() => {
        const readMs = (name, fallback) => {
          const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
          const value = Number.parseFloat(raw);
          if (!Number.isFinite(value)) return fallback;
          return raw.endsWith('ms') ? value : value * 1000;
        };
        const threshold = readMs('--page-loader-threshold', 300);
        const duration = readMs('--page-loader-progress-duration', 4000);
        const exitHold = readMs('--page-loader-exit-hold', 150);
        const fadeDuration = readMs('--page-loader-fade-duration', 400);
        const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
        let shown = false;
        let done = false;
        let raf = 0;
        let startedAt = 0;
        let loader;
        let count;

        const setProgress = (value) => {
          if (!loader || !count) return;
          const clamped = Math.max(0, Math.min(100, value));
          loader.style.setProperty('--page-loader-progress', String(clamped / 100));
          count.textContent = `${Math.round(clamped)}%`;
        };

        const finish = () => {
          if (done) return;
          done = true;
          cancelAnimationFrame(raf);
          window.__finishPageLoader = finish;
          if (!shown || !loader) return;
          setProgress(100);
          setTimeout(() => {
            loader.dataset.done = 'true';
            loader.style.pointerEvents = 'none';
            setTimeout(() => loader?.remove(), fadeDuration);
          }, exitHold);
        };

        const tick = (time) => {
          if (done || !shown) return;
          if (!startedAt) startedAt = time;
          const elapsed = Math.min(1, (time - startedAt) / duration);
          const eased = 1 - Math.pow(1 - elapsed, 4);
          setProgress(eased * 90);
          raf = requestAnimationFrame(tick);
        };

        const show = () => {
          if (done || shown) return;
          shown = true;
          document.body.insertAdjacentHTML(
            'afterbegin',
            '<div id="page-loader" aria-hidden="true"><div class="page-loader__inner"><div class="page-loader__meter"><div class="page-loader__bar"></div></div><div class="page-loader__count">0%</div></div></div>'
          );
          loader = document.getElementById('page-loader');
          count = loader?.querySelector('.page-loader__count');
          setProgress(reduceMotion ? 100 : 0);
          requestAnimationFrame(() => {
            if (!loader || done) return;
            loader.dataset.visible = 'true';
            if (!reduceMotion) raf = requestAnimationFrame(tick);
          });
        };

        window.__finishPageLoader = finish;
        window.addEventListener('load', finish, { once: true });
        setTimeout(show, threshold);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
